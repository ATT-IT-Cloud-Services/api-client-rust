name: Reusable — API client (Rust) build

on:
  workflow_call:
    inputs:
      project-dir:
        type: string
        default: .

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo build
        run: cargo build --all-targets

      - name: Cargo test
        run: cargo test

      - name: Verify no localized runtime strings in src
        run: |
          if rg -n '"[^"]*(?:Bitte|Fehler| erfolgreich| nicht verfügbar)"' src/ 2>/dev/null; then
            echo "Localized UI strings found in public API client src/" >&2
            exit 1
          fi
          echo "OK — no obvious localized strings in src/"
