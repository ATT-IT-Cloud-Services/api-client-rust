name: Reusable — GitHub release (api-client-rust)

on:
  workflow_call:
    inputs:
      project-dir:
        type: string
        default: .

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve release metadata
        id: meta
        working-directory: ${{ inputs.project-dir }}
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          chmod +x scripts/resolve-app-version.sh
          TAG=$(scripts/resolve-app-version.sh tag)
          TITLE=$(scripts/resolve-app-version.sh title api-client-rust)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Prepare release files
        working-directory: ${{ inputs.project-dir }}
        run: |
          chmod +x scripts/prepare-release-assets.sh
          scripts/prepare-release-assets.sh "$PWD" "$GITHUB_WORKSPACE/release-upload"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: false
          body: |
            Automated **api-client-rust** build from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

            ### Downloads

            | File | Description |
            |---|---|
            | `elizon-api-client-*.crate` | Cargo package (`cargo install --path` after extract, or path dependency) |
            | `elizon-api-client-*-src.zip` | Source tree (`src/`, `Cargo.toml`, examples) |

            Add as a git dependency from this repository, or unpack the assets locally.
          files: |
            release-upload/*
