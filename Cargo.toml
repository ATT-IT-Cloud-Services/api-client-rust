[package]
name = "ignite-api-client"
version = "0.2.0"
edition = "2021"
description = "Official ignite API client"
license-file = "LICENSE.md"
readme = "README.md"
rust-version = "1.75"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "auth"
path = "examples/auth.rs"

[[example]]
name = "services"
path = "examples/services.rs"

[[example]]
name = "checkout"
path = "examples/checkout.rs"

[[example]]
name = "pay_invoice"
path = "examples/pay_invoice.rs"
